        <header class="main-header" align="center">
            <div class="header-container">
                <h1 class="brand-title">SMK BAKTI NUSANTARA 666</h1>
             
            </div>
        </header>

        <main class="main-content">
            <section class="form-section">
                <h2 class="section-title">Form Pendaftaran Siswa Baru</h2>
                <p class="section-desc">Isi formulir di bawah ini dengan data yang benar dan lengkap</p>

                <form action="proses.php" method="post" class="custom-form">

                    <div class="form-group">
                        <label for="nama">Nama Lengkap :</label>
                        <input type="text" id="nama" placeholder="Nama lengkap siswa" required><br>
                    </div>

                    <div class="form-group">
                        <label for="email">Email :</label>
                        <input type="email" id="email" placeholder="contoh@gmail.com" required>
                    </div>

                    <div class="form-group">
                        <label for="password">Password :</label>
                        <input type="password" id="password" placeholder="minimal 8 karakter" required>
                    </div>

                    <div class="form-group">
                        <label for="tgl">Tanggal Lahir :</label>
                        <input type="date" id="tgl" name="tanggal_lahir" required>
                    </div>

                    <div class="form-group">
                        <label class="group-label">Jenis Kelamin :</label>
                        <div class="radio-group">
                            <label class="inline-label"><input type="radio" name="jk" value="L" required>Laki
                                Laki</label>
                            <label class="inline-label"><input type="radio" name="jk" value="P"
                                    required>Perempuan</label>

                        </div>
                    </div>

                    <div class="form-group">
                        <label for="jurusan">Pilihan Jurusan:</label>
                        <select id="jurusan" name="jurusan" required>
                            <option value="">--- Pilih Jurusan ---</option>
                            <option value="pplg">PPLG (Pengembangan Perangkat Lunak & Gim)</option>
                            <option value="tjkt">TJKT (Teknik Jaringan Komputer & Telekomunikasi)</option>
                            <option value="dkv">DKV (Desain Komunikasi Visual)</option>
                        </select>
                    </div>

                    <!-- Textarea (Teks Panjang) -->
                    <div class="form-group">
                        <label for="alamat">Alamat Lengkap:</label><br>
                        <textarea id="alamat" name="alamat" rows="4" placeholder="Alamat rumah lengkap"
                            required></textarea>
                    </div>

                    <div class="form-group">
                        <label class="group-label">Minat & Keahlian :
                        </label>
                        <div class="checkbox-group">
                            <label class="inline-label">
                                <input type="checkbox" name="minat" value="web">Web Development
                            </label>

                            <label class="inline-label">
                                <input type="checkbox" name="minat" value="game">Game Development
                            </label>
                        </div>
                    </div>

                    <div class="button-group">
                        <button type="sumbit" class="btn" btn-sumbit>Kirim</button>
                        <button type="reset" class="btn" btn-reset>Reset</button>
                    </div>



                </form>
            </section>
        </main>
